name: My First workflow

on: 
  push:
    branches: 
      - dev

jobs:
  hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: Hello world action step
        run: echo "Hello world! Welcome to my first workflow"
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test